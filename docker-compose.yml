services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-coder
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ports:
      - "${LLAMA_PORT:-8081}:8080"
    volumes:
      - llama_models:/models
    environment:
      LLAMA_MODEL: ${LLAMA_MODEL:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-999}
      CTX_SIZE: ${CTX_SIZE:-8192}
    command:
      - --model
      - /models/${LLAMA_MODEL:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "${N_GPU_LAYERS:-999}"
      - --ctx-size
      - "${CTX_SIZE:-8192}"
    networks:
      - ai-net

volumes:
  llama_models:
    driver: local

networks:
  ai-net:
    driver: bridge
