# CPU-only override — no GPU acceleration.
# Usage: podman-compose --env-file .env -f docker-compose.cpu.yml up -d
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ${LLAMA_CONTAINER_NAME}-cpu

    restart_policy:
      condition: on-failure
      max_retries: 10
      delay: 5s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 30s

    devices: []

    environment:
      LLAMA_MODEL: ${LLAMA_MODEL}
      N_GPU_LAYERS: "0"
      CUDA_VISIBLE_DEVICES: ""
      CTX_SIZE: ${CTX_SIZE:-32768}
      N_THREADS: ${N_THREADS:-16}
      N_THREADS_BATCH: ${N_THREADS_BATCH:-16}

    command:
      - --model
      - /models/${LLAMA_MODEL}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --n-gpu-layers
      - "0"
      - --ctx-size
      - "${CTX_SIZE}"
      - --parallel
      - "1"
      - --threads
      - "${N_THREADS}"
      - --threads-batch
      - "${N_THREADS_BATCH}"

    ports:
      - "127.0.0.1:${LLAMA_PORT:-8081}:8080"

    volumes:
      - llama_models:/models:rw

    networks:
      - ai-net

    security_opt:
      - no-new-privileges:true
      - label=disable
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai-net:
    driver: bridge

volumes:
  llama_models:
    external: true
