[project]
name = "gb-ai-server"
version = "0.1.0"
description = "gbrennon llama server"
readme = "README.md"
authors = [
    { name = "Glauber Brennon", email = "glauberbrennon@gmail.com" }
]
requires-python = ">=3.14.3"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "jinja2>=3.1.5",
    "pyyaml>=6.0",
    "huggingface-hub>=1.20.1",
    "hf-transfer>=0.1.9",
    "pytest-cov>=7.1.0",
]

[project.scripts]
pr-auto-reviewer = "pr_auto_reviewer.cli:main"
gb-ai-server = "gb_ai_server.presentation.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "**/inbound/*.py",
    "**/outbound/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "strict"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=gb_ai_server",
    "--cov-report=term-missing",
]

